upstream application_instances {
    server platform-recovery-api:4000;
}

server {
    listen 80;

    location / {
        proxy_pass http://application_instances;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;

        add_header X-Gateway-Instance gateway-recovery always;
    }
}
