upstream application_instances {
    server api-1:4000 max_fails=1 fail_timeout=2s;
    server api-2:4000 max_fails=1 fail_timeout=2s;
}

server {
    listen 80;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://application_instances;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Gateway-Instance gateway-tls always;
    }
}
