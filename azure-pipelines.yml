trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: production-platform-api
  imageTag: $(Build.SourceVersion)

stages:
  - stage: Validate
    displayName: Validate source
    jobs:
      - job: Test
        displayName: Run automated tests
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Use Node.js 22
            inputs:
              version: 22.x

          - script: npm ci
            displayName: Install locked dependencies

          - script: npm test
            displayName: Run tests

  - stage: Build
    displayName: Build immutable Docker image
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: DockerImage
        displayName: Build and package image
        steps:
          - checkout: self
            clean: true

          - script: |
              docker buildx create \
                --name pipeline-arm64-builder \
                --driver docker-container \
                --use

              docker buildx build \
                --platform linux/arm64 \
                --load \
                --label org.opencontainers.image.revision=$(Build.SourceVersion) \
                --tag $(imageRepository):$(imageTag) \
                .
            displayName: Build ARM64 Docker image

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)

              docker image inspect \
                $(imageRepository):$(imageTag) \
                --format '{{.Id}}' \
                > $(Build.ArtifactStagingDirectory)/image-id.txt

              docker image inspect \
                $(imageRepository):$(imageTag) \
                --format '{{.Architecture}}' \
                > $(Build.ArtifactStagingDirectory)/image-architecture.txt

              docker save $(imageRepository):$(imageTag) | gzip \
                > $(Build.ArtifactStagingDirectory)/$(imageRepository)-$(Build.BuildId).tar.gz
            displayName: Package immutable image

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: docker-image
            displayName: Publish Docker image artifact

  - stage: DeployStaging
    displayName: Deploy immutable image to staging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployProductionLab
        displayName: Roll out on production-lab
        environment:
          name: staging
          resourceType: VirtualMachine
          resourceName: production-lab
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: current
                  artifact: docker-image
                  displayName: Download tested Docker image

                - bash: |
                    set -Eeuo pipefail

                    DEPLOY_DIR=/home/ubuntu/platform-deploy
                    ENV_FILE="$DEPLOY_DIR/environments/staging.env"
                    IMAGE_NAME="$(imageRepository):$(imageTag)"
                    IMAGE_ARCHIVE="$(find "$(Pipeline.Workspace)/docker-image" -type f -name '*.tar.gz' -print -quit)"

                    test -d "$DEPLOY_DIR"
                    test -f "$ENV_FILE"
                    test -n "$IMAGE_ARCHIVE"

                    gzip -dc "$IMAGE_ARCHIVE" | docker load

                    IMAGE_ARCHITECTURE="$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')"
                    test "$IMAGE_ARCHITECTURE" = arm64

                    OLD_IMAGE="$(sed -n 's/^APP_IMAGE=//p' "$ENV_FILE" | tail -n 1)"
                    OLD_VERSION="$(sed -n 's/^APP_VERSION=//p' "$ENV_FILE" | tail -n 1)"

                    rollback() {
                      echo "Deployment failed; rolling staging back to $OLD_IMAGE"
                      sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$OLD_IMAGE|" "$ENV_FILE"
                      sed -i "s|^APP_VERSION=.*|APP_VERSION=$OLD_VERSION|" "$ENV_FILE"

                      cd "$DEPLOY_DIR"
                      docker compose \
                        --env-file environments/staging.env \
                        -p platform-staging \
                        up -d --no-deps \
                        api-1 api-2 outbox-relay worker-1 worker-2

                      docker compose \
                        --env-file environments/staging.env \
                        -p platform-staging \
                        restart gateway
                    }

                    trap rollback ERR

                    sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE_NAME|" "$ENV_FILE"
                    sed -i "s|^APP_VERSION=.*|APP_VERSION=$(Build.SourceVersion)|" "$ENV_FILE"

                    cd "$DEPLOY_DIR"

                    for SERVICE in api-1 api-2; do
                      docker compose \
                        --env-file environments/staging.env \
                        -p platform-staging \
                        up -d --no-deps "$SERVICE"

                      CONTAINER="platform-staging-${SERVICE}-1"

                      for ATTEMPT in $(seq 1 30); do
                        STATUS="$(docker inspect "$CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
                        if [ "$STATUS" = healthy ]; then
                          break
                        fi

                        if [ "$ATTEMPT" -eq 30 ]; then
                          docker logs "$CONTAINER" --tail 100
                          exit 1
                        fi

                        sleep 2
                      done

                      docker compose \
                        --env-file environments/staging.env \
                        -p platform-staging \
                        exec -T gateway nginx -s reload
                    done

                    docker compose \
                      --env-file environments/staging.env \
                      -p platform-staging \
                      up -d --no-deps outbox-relay worker-1 worker-2

                    curl --fail --silent --show-error --insecure \
                      https://127.0.0.1:8443/ready

                    WHOAMI="$(curl --fail --silent --show-error --insecure \
                      https://127.0.0.1:8443/whoami)"

                    echo "$WHOAMI"
                    echo "$WHOAMI" | grep -F '$(Build.SourceVersion)'

                    trap - ERR
                    echo "Staging deployment succeeded: $IMAGE_NAME"
                  displayName: Load, roll out, smoke test, and rollback on failure

  - stage: DeployProduction
    displayName: Deploy approved image to production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        displayName: Roll out on production-lab
        environment:
          name: production
          resourceType: VirtualMachine
          resourceName: production-lab
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: current
                  artifact: docker-image
                  displayName: Download approved Docker image

                - bash: |
                    set -Eeuo pipefail

                    DEPLOY_DIR=/home/ubuntu/platform-deploy
                    ENV_FILE="$DEPLOY_DIR/environments/production.env"
                    IMAGE_NAME="$(imageRepository):$(imageTag)"
                    IMAGE_ARCHIVE="$(find "$(Pipeline.Workspace)/docker-image" -type f -name '*.tar.gz' -print -quit)"

                    test -d "$DEPLOY_DIR"
                    test -f "$ENV_FILE"
                    test -n "$IMAGE_ARCHIVE"

                    gzip -dc "$IMAGE_ARCHIVE" | docker load

                    IMAGE_ARCHITECTURE="$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')"
                    test "$IMAGE_ARCHITECTURE" = arm64

                    OLD_IMAGE="$(sed -n 's/^APP_IMAGE=//p' "$ENV_FILE" | tail -n 1)"
                    OLD_VERSION="$(sed -n 's/^APP_VERSION=//p' "$ENV_FILE" | tail -n 1)"

                    rollback() {
                      echo "Production deployment failed; rolling back to $OLD_IMAGE"
                      sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$OLD_IMAGE|" "$ENV_FILE"
                      sed -i "s|^APP_VERSION=.*|APP_VERSION=$OLD_VERSION|" "$ENV_FILE"

                      cd "$DEPLOY_DIR"
                      docker compose \
                        --env-file environments/production.env \
                        -p platform-production \
                        up -d --no-deps \
                        api-1 api-2 outbox-relay worker-1 worker-2

                      docker compose \
                        --env-file environments/production.env \
                        -p platform-production \
                        restart gateway
                    }

                    trap rollback ERR

                    sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE_NAME|" "$ENV_FILE"
                    sed -i "s|^APP_VERSION=.*|APP_VERSION=$(Build.SourceVersion)|" "$ENV_FILE"

                    cd "$DEPLOY_DIR"

                    for SERVICE in api-1 api-2; do
                      docker compose \
                        --env-file environments/production.env \
                        -p platform-production \
                        up -d --no-deps "$SERVICE"

                      CONTAINER="platform-production-${SERVICE}-1"

                      for ATTEMPT in $(seq 1 30); do
                        STATUS="$(docker inspect "$CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
                        if [ "$STATUS" = healthy ]; then
                          break
                        fi

                        if [ "$ATTEMPT" -eq 30 ]; then
                          docker logs "$CONTAINER" --tail 100
                          exit 1
                        fi

                        sleep 2
                      done

                      docker compose \
                        --env-file environments/production.env \
                        -p platform-production \
                        exec -T gateway nginx -s reload
                    done

                    docker compose \
                      --env-file environments/production.env \
                      -p platform-production \
                      up -d --no-deps outbox-relay worker-1 worker-2

                    curl --fail --silent --show-error \
                      http://127.0.0.1:8090/ready

                    WHOAMI="$(curl --fail --silent --show-error \
                      http://127.0.0.1:8090/whoami)"

                    echo "$WHOAMI"
                    echo "$WHOAMI" | grep -F '$(Build.SourceVersion)'

                    trap - ERR
                    echo "Production deployment succeeded: $IMAGE_NAME"
                  displayName: Load, roll out, smoke test, and rollback on failure
