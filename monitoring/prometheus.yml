global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: staging-api
    static_configs:
      - targets:
          - platform-staging-api-1-1:4000
          - platform-staging-api-2-1:4000
        labels:
          environment: staging

  - job_name: production-api
    static_configs:
      - targets:
          - platform-production-api-1-1:4000
          - platform-production-api-2-1:4000
        labels:
          environment: production

  - job_name: ubuntu-node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: docker-containers
    static_configs:
      - targets: [cadvisor:8080]
