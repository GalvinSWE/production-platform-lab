x-api-environment: &api-environment
  APP_ENV: ${APP_ENV}
  APP_VERSION: ${APP_VERSION}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_NAME: ${POSTGRES_DB}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
  S3_SECRET_KEY_FILE: /run/secrets/minio_root_password

x-worker-environment: &worker-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_NAME: ${POSTGRES_DB}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [platform-network]

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    tmpfs:
      - /data
    networks: [platform-network]

  rabbitmq:
    image: rabbitmq@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    hostname: rabbitmq
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        printf 'default_user = %s\ndefault_pass = %s\n' \
          "$${RABBITMQ_USER}" \
          "$$(cat /run/secrets/rabbitmq_password)" \
          > /tmp/rabbitmq.conf
        chmod 600 /tmp/rabbitmq.conf
        exec rabbitmq-server
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_CONFIG_FILE: /tmp/rabbitmq
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [platform-network]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    hostname: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    networks: [platform-network]

  api-1:
    image: ${APP_IMAGE}
    hostname: api-1
    restart: unless-stopped
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1
      OTEL_SERVICE_NAME: platform-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${APP_ENV},service.version=${APP_VERSION},service.instance.id=api-1
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [platform-network]

  api-2:
    image: ${APP_IMAGE}
    hostname: api-2
    restart: unless-stopped
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2
      OTEL_SERVICE_NAME: platform-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${APP_ENV},service.version=${APP_VERSION},service.instance.id=api-2
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [platform-network]

  outbox-relay:
    image: ${APP_IMAGE}
    hostname: outbox-relay
    restart: unless-stopped
    command: ["node", "src/outbox-relay.js"]
    environment:
      <<: *worker-environment
      OUTBOX_POLL_INTERVAL_MS: 1000
    secrets:
      - postgres_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [platform-network]

  worker-1:
    image: ${APP_IMAGE}
    hostname: worker-1
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      <<: *worker-environment
      WORKER_ID: worker-1
      WORKER_DELAY_MS: ${WORKER_DELAY_MS}
    secrets:
      - postgres_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [platform-network]

  worker-2:
    image: ${APP_IMAGE}
    hostname: worker-2
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      <<: *worker-environment
      WORKER_ID: worker-2
      WORKER_DELAY_MS: ${WORKER_DELAY_MS}
    secrets:
      - postgres_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [platform-network]

  gateway:
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
      - "${GATEWAY_HTTPS_PORT}:443"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_FILE}:/etc/nginx/tls/server.key:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks: [platform-network]

networks:
  platform-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME}
    external: true
  minio-data:
    name: ${MINIO_VOLUME_NAME}
    external: true
  rabbitmq-data:
    name: ${RABBITMQ_VOLUME_NAME}
    external: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE}
  rabbitmq_password:
    file: ${RABBITMQ_PASSWORD_SECRET_FILE}
  minio_root_user:
    file: ${MINIO_ROOT_USER_SECRET_FILE}
  minio_root_password:
    file: ${MINIO_ROOT_PASSWORD_SECRET_FILE}
